name: ci
on: { push: { branches: ["**"] }, pull_request: {} }
jobs:
  check:
    strategy: { fail-fast: false, matrix: { os: [windows-latest, ubuntu-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # Every cargo invocation below is --locked. Without it CI silently
      # resolves past the committed Cargo.lock, so a green run would prove
      # nothing about the dependency graph that was actually reviewed -- and
      # the zero-copy claim rests on there being exactly one `arrow` in that
      # graph, which the last step checks. `cargo fmt` reads no lockfile.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: unit + integration tests (no dataset)
        run: cargo test --locked --workspace --all-targets
      - name: doc tests
        run: cargo test --locked --workspace --doc
      - name: dataset tests (only where KITTI is present)
        if: ${{ env.PIPES_KITTI_ROOT != '' }}
        run: cargo test --locked -p pipes-kitti -- --ignored
      - name: no duplicate arrow
        shell: bash
        run: if cargo tree --locked -d -e normal | grep -E '^arrow(-[a-z]+)? v'; then echo "duplicate arrow crate"; exit 1; fi
